
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JS Arrays & Loops Demo</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="style.css" rel="stylesheet">
</head>

<body>

  <!-- Header -->
  <header class="py-4 border-bottom bg-dark text-white">
    <div class="container">
      <h1 class="h4 m-0">JS Arrays & Loops Demo</h1>
    </div>
  </header>

  <main class="container py-5">

    <!-- Button Section -->
    <div class="row justify-content-center mb-4">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow">
          <div class="card-body text-center">

            <div class="btn-toolbar gap-2 mb-3 justify-content-center" role="toolbar">

              <!-- List Foods Button -->
              <button id="btnList" class="btn btn-primary">List Foods</button>

              <!-- Numbered List Button -->
              <button id="btnNums" class="btn btn-success">Numbered List</button>

              <!-- Filter Button -->
              <button id="btnFilter" class="btn btn-warning">Filter by Letter</button>

              <!-- Food Cards Button -->
              <button id="btnForEach" class="btn btn-info">Food Cards</button>

              <!-- Uppercase Button -->
              <button id="btnUppercase" class="btn btn-primary">Uppercase List</button>

              <!-- Reverse Button -->
              <button id="btnReverse" class="btn btn-success">Reverse List</button>

              <!-- Random Food Button -->
              <button id="btnRandom" class="btn btn-warning">Random Food</button>

            </div>

            <p class="text-secondary small m-0">
              Click a button to render below.
            </p>

          </div>
        </div>

      </div>
    </div>

    <!-- Output Section -->
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">

        <h2 class="h6 text-uppercase text-secondary mb-3 text-center">
          Output
        </h2>

        <div id="out" class="border rounded p-3 bg-light">
          Output will appear here...
        </div>

      </div>
    </div>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript File -->
  <script src="script.js"></script>

</body>
</html>
